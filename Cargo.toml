[workspace]
resolver = "3"
members  = [
  "crates/alchemy-core",
  "crates/alchemy-api",
  "bin/alchemy",
  "bin/alchemyd",
  "bin/alchemy-helper",
  "app/alchemy-gui",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT"
repository   = "https://github.com/hostingaccessories/alchemy"
publish      = false

[workspace.dependencies]
alchemy-core = { path = "crates/alchemy-core" }
alchemy-api  = { path = "crates/alchemy-api" }
alchemyd     = { path = "bin/alchemyd" }

anyhow             = "1"
axum               = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
bollard            = { version = "0.21", default-features = false, features = ["pipe"] }
clap               = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env", "string"] }
clap_complete      = { version = "4.6", default-features = false }
clap_mangen        = { version = "0.3", default-features = false, features = ["env"] }
futures-util       = { version = "0.3", default-features = false, features = ["alloc"] }
http-body-util     = { version = "0.1.5", default-features = false }
hyper              = { version = "1.12", default-features = false }
hyper-util         = { version = "0.1.21", default-features = false }
rust-embed         = { version = "8", features = ["mime-guess"] }
rusqlite           = { version = "0.40", default-features = false, features = ["bundled"] }
rustix             = { version = "1", default-features = false, features = ["std", "process"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = { version = "0.11", default-features = false }
sysinfo           = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
tempfile           = "3"
thiserror          = "2"
tokio              = { version = "1", default-features = false }
tower              = { version = "0.5", default-features = false, features = ["util"] }
tower-http         = { version = "0.7", default-features = false, features = ["cors"] }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }

tauri                        = { version = "2.12", features = [] }
tauri-build                  = { version = "2.7", features = [] }
tauri-plugin-opener          = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state    = "2.5"

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
todo                     = "deny"
dbg_macro                = "deny"
indexing_slicing         = "deny"
pedantic                 = { level = "warn", priority = -1 }
module_name_repetitions  = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
must_use_candidate       = "allow"

[profile.release]
strip = "symbols"
lto   = "thin"
