name: CI

on:
  pull_request:
    branches: [main]

  # Intentionally skipping main
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        uses: $/.github/actions/install-tauri-deps

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The real mDNS responders, ignored above. `--workspace` keeps the
      # features, and so the build, of the step before.
      - name: mDNS backend tests (avahi, built-in)
        if: matrix.os == 'ubuntu-24.04'
        timeout-minutes: 5
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 \
            install -y --no-install-recommends avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon
          cargo test --workspace --locked --test mdns -- --ignored --test-threads=1
          sudo systemctl stop avahi-daemon.socket avahi-daemon.service
          cargo test --workspace --locked --test mdns -- --ignored --test-threads=1 builtin

      # Also resolves the name with `dns-sd -G v4`.
      - name: mDNS backend tests (dns-sd)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: cargo test --workspace --locked --test mdns -- --ignored --test-threads=1

  smoke:
    name: Release smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        uses: $/.github/actions/install-tauri-deps

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Release smoke test
        run: scripts/release-smoke.sh

      # Reuses the smoke test's release build.
      - name: Home-network test
        if: runner.os == 'Linux'
        env:
          HOME_NET_SKIP_BUILD: "1"
        run: scripts/home-network.sh

      # Reuses the smoke test's release build. Port 80 is reached only
      # through alchemy-helper: target/ isn't root-owned, so alchemyd answers
      # needs_terminal and the script runs the sudo command itself, then
      # alchemyd re-execs with the same PID. It revokes and checks port 80 is
      # refused again.
      - name: Web-address and privileged helper test
        if: runner.os == 'Linux'
        env:
          WEB_ADDR_SKIP_BUILD: "1"
          WEB_ADDR_GRANT: "1"
        run: scripts/web-address.sh

      # Reuses the smoke test's release build. Kills alchemyd with apps up
      # and checks what a restart brings back, what stays down, and that a
      # failing app is reported.
      - name: Recovery test
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          RECOVERY_SKIP_BUILD: "1"
        run: scripts/recovery.sh

      # Reuses the smoke test's release build; grants port 80 through
      # alchemy-helper.
      # Runs last: it installs avahi-daemon, which the steps above don't
      # expect.
      - name: mDNS test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MDNS_SKIP_BUILD: "1"
          MDNS_GRANT: "1"
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 \
            install -y --no-install-recommends avahi-daemon avahi-utils libnss-mdns
          scripts/mdns.sh

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build
