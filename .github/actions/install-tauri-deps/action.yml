name: Install Tauri Linux build deps
description: >
  Install the GTK/WebKit -dev packages the Tauri crate links so
  `cargo clippy/test --workspace` works on Linux. Always refreshes apt lists
  first; the runner image's baked-in lists go stale and 404 on superseded
  packages.
runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      run: |
        sudo apt-get -o DPkg::Lock::Timeout=300 update
        sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 \
          install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev

    - name: Verify deps are visible to pkg-config
      shell: bash
      run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 librsvg-2.0
