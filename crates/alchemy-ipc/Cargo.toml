[package]
name                   = "alchemy-ipc"
description            = "IPC protocol, framing, and codec between alchemyd and its local clients."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[dependencies]
alchemy-core = { workspace = true }
alchemy-api  = { workspace = true, optional = true, features = ["socket"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true, optional = true, features = ["io-util"] }

[features]
default   = []
transport = ["dep:tokio", "dep:alchemy-api"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }

[lints]
workspace = true
