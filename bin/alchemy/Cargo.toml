[package]
name                   = "alchemy"
description            = "Alchemy CLI: a local IPC client of alchemyd."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "alchemy"
path = "src/main.rs"

[lib]
name = "alchemy"
path = "src/lib.rs"

[features]
# The hidden `safety-probe` command and `FakePrompt`, for this crate's own
# tests. Release builds never enable it.
test-command = []

[dependencies]
alchemy-core = { workspace = true }
alchemy-ipc  = { workspace = true, features = ["transport"] }
clap         = { workspace = true }
interprocess = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }

[dev-dependencies]
# Itself, to turn on `test-command` for the e2e tests: they build the
# library as an ordinary dependency, which `cfg(test)` doesn't reach.
alchemy  = { path = ".", features = ["test-command"] }
alchemyd = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
