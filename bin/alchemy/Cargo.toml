[package]
name                   = "alchemy"
description            = "Manage Alchemy from the command line."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "alchemy"
path = "src/main.rs"

[lib]
name = "alchemy"
path = "src/lib.rs"

[features]
# The hidden `safety-probe` command and `FakePrompt`, for this crate's own
# tests. Release builds never enable it.
test-command = []

[dependencies]
alchemy-api    = { workspace = true, features = ["socket"] }
alchemy-core   = { workspace = true }
clap           = { workspace = true }
clap_complete  = { workspace = true }
clap_mangen    = { workspace = true }
http-body-util = { workspace = true }
hyper          = { workspace = true, features = ["client", "http1"] }
hyper-util     = { workspace = true, features = ["tokio"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true, features = ["rt", "net", "time", "macros", "signal", "sync"] }

[dev-dependencies]
# Itself, to turn on `test-command` for the e2e tests: they build the
# library as an ordinary dependency, which `cfg(test)` doesn't reach.
alchemy      = { path = ".", features = ["test-command"] }
alchemyd     = { workspace = true }
axum         = { workspace = true }
futures-util = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "sync", "test-util"] }

[lints]
workspace = true
