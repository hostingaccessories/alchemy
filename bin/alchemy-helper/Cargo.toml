[package]
name                   = "alchemy-helper"
description            = "Privileged one-shot for Alchemy. Refuses to run unless already root."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "alchemy-helper"
path = "src/main.rs"

[lib]
name = "alchemy_helper"
path = "src/lib.rs"

[dependencies]
clap      = { workspace = true }
rustix    = { workspace = true, features = ["fs"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
