[package]
name                   = "alchemyd"
description            = "Alchemy daemon: owns Compose stacks and serves the HTTP API and web UI, and the API on a per-user Unix socket."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "alchemyd"
path = "src/main.rs"

[lib]
name = "alchemyd"
path = "src/lib.rs"

[dependencies]
alchemy-api        = { workspace = true, features = ["socket", "state-dir"] }
alchemy-core       = { workspace = true }
anyhow             = { workspace = true }
axum               = { workspace = true }
base64             = { workspace = true }
bollard            = { workspace = true }
clap               = { workspace = true }
futures-util       = { workspace = true }
getrandom          = { workspace = true }
http-body-util     = { workspace = true }
hyper              = { workspace = true, features = ["server", "client", "http1"] }
hyper-util         = { workspace = true, features = ["tokio"] }
rust-embed         = { workspace = true }
rusqlite           = { workspace = true }
rustix             = { workspace = true, features = ["fs"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
sysinfo            = { workspace = true }
tempfile           = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "process", "time"] }
tower-http         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
mdns-sd = { workspace = true }
zbus    = { workspace = true }

[dev-dependencies]
tokio     = { workspace = true, features = ["test-util"] }
tower      = { workspace = true }

[lints]
workspace = true
